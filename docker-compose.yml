version: '3.8'

services:
  app:
    build: 
      # Contexto a la carpeta anidada
      context: "./app" 
      dockerfile: Dockerfile
    container_name: dotacion_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8091:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mapea los logs desde la carpeta anidada del contenedor
      - ./app_logs:/usr/src/app/logs 

  db:
    image: core-harbor-devops-msgc.gcba.gob.ar/devops-dockerhub/mysql:8.0
    container_name: dotacion_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
