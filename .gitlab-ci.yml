stages:
  - validate
  - build
  - deploy

default:
  # Todos los jobs de un pipeline comparten el mismo directorio de trabajo en este
  # runner (shell executor). Si una corrida anterior dejó archivos root-owned (ej.
  # node_modules/dist creados por un `docker run` sin --user), el `git clean` del
  # próximo `get_sources` falla ANTES de que corra el script de ningún job. Este
  # hook corre justo antes de eso, así que es el único lugar donde se puede arreglar.
  hooks:
    pre_get_sources_script:
      - if [ -d "$CI_PROJECT_DIR" ]; then docker run --rm -v "$CI_PROJECT_DIR":/app alpine chown -R $(id -u):$(id -g) /app || true; fi

chequeo_sintaxis:
  stage: validate
  script:
    - echo "Buscando errores de sintaxis..."
    - docker run --rm -v $(pwd):/app -w /app node:20-alpine find . -type f -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +
  allow_failure: false

build_frontend:
  stage: build
  only:
    - develop
  script:
    - echo "Build del frontend..."
    # Por si quedaron node_modules/dist root-owned de una corrida anterior (ver nota
    # abajo), se los devolvemos al usuario del runner antes de tocar nada, si no el
    # checkout de la próxima corrida no puede limpiarlos.
    - docker run --rm -v $(pwd):/app alpine chown -R $(id -u):$(id -g) /app
    # El runner es shell executor: ignora la keyword `image:`, por eso invocamos
    # Docker explícitamente (mismo patrón que chequeo_sintaxis, que sí funciona).
    # --user + HOME=/tmp: corre npm como el usuario del runner (no root), para que
    # node_modules/dist no queden root-owned en el disco del runner.
    - docker run --rm -v $(pwd):/app -w /app/frontend -e VERCEL=1 -e HOME=/tmp --user "$(id -u):$(id -g)" core-harbor-devops-msgc.gcba.gob.ar/devops-dockerhub/node:20-alpine sh -c "npm ci && npm run build"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

deploy_dev:
  stage: deploy
  image: core-harbor-devops-msgc.gcba.gob.ar/devops-images/docker-compose-deploy
  only:
    - develop
  dependencies:
    - build_frontend
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - echo "Conectando a la VM $SERVER_IP para actualizar la App Dotación..."
    # 1. Primero actualizar el código en el servidor (git reset pisa public/spa/)
    - ssh $SERVER_USER@$SERVER_IP "cd /opt/dotacion-rrhh && sudo git fetch origin develop && sudo git reset --hard origin/develop && sudo git clean -fd"
    # 2. Después copiar el SPA buildeado por CI (sobre el public/spa/ ya limpio)
    # sudo mkdir + chown para que scp (sin sudo) pueda escribir
    - ssh $SERVER_USER@$SERVER_IP "sudo mkdir -p /opt/dotacion-rrhh/app/public/spa && sudo chown -R $SERVER_USER:$SERVER_USER /opt/dotacion-rrhh/app/public/spa"
    - scp -r frontend/dist/* $SERVER_USER@$SERVER_IP:/opt/dotacion-rrhh/app/public/spa/
    # 3. Finalmente buildear la imagen (COPY . . incluye el SPA recién copiado)
    - ssh $SERVER_USER@$SERVER_IP "cd /opt/dotacion-rrhh && sudo docker compose build --no-cache && sudo docker compose up -d"
    - echo "Despliegue finalizado con éxito!"
