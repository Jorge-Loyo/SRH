services:
  - type: web
    name: srh-api
    runtime: node
    rootDir: app
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: db
      - key: AUTH_COOKIES
        value: true
      - key: AUTH_IDLE_MINUTES
        value: 30
      - key: TOKEN_RETENTION_DAYS
        value: 30
      - key: AUDIT_RETENTION_DAYS
        value: 30
      - key: DB_DIALECT
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
