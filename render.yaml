services:
  - type: web
    name: srh-backend
    runtime: node
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: true
      - key: DB_DIALECT
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: srh-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: srh-mysql
          property: port
      - key: DB_USER
        fromDatabase:
          name: srh-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: srh-mysql
          property: password
      - key: DB_NAME
        fromDatabase:
          name: srh-mysql
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: db
      - key: AUTH_COOKIES
        value: true
      - key: AUTH_IDLE_MINUTES
        value: 30
      - key: TOKEN_RETENTION_DAYS
        value: 30
      - key: AUDIT_RETENTION_DAYS
        value: 30
