<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Gestión - Hospitales</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ESTILOS GENERALES */
        :root {
            --azul-oscuro: #153244;
            --amarillo: #ffcc00;
            --celeste: #8de2d6;
            --blanco: #ffffff;
            --gris-claro: #f4f7f6;
            --gris-bordes: #e0e0e0;
            --naranja-suave: #ffe5b4; 
            --gris-texto: #999999; 
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: var(--blanco);
            color: var(--azul-oscuro);
            display: flex;
            flex-direction: column; 
            height: 100vh;
            overflow: hidden; 
        }

        /* ENCABEZADO SUPERIOR FIJO (AJUSTADO MÁS ALTO) */
        .encabezado-superior {
            height: 120px; /* Antes 70px, ahora más alto para dar espacio al logo */
            background-color: var(--azul-oscuro);
            border-bottom: 4px solid var(--amarillo);
            display: flex;
            align-items: center;
            padding: 0 40px;
            flex-shrink: 0; 
            z-index: 10;
        }

        .logo-plataforma {
            height: 90px; /* Antes 40px, más del doble de tamaño */
            max-width: 600px; /* Aumentado para evitar recortes a lo ancho */
            object-fit: contain; 
        }

        /* CONTENEDOR PRINCIPAL QUE ABARCA LAS DOS COLUMNAS */
        .contenedor-principal {
            display: flex;
            flex: 1; 
            overflow: hidden;
        }

        /* COLUMNAS */
        .columna-izquierda {
            width: 30%;
            background-color: var(--blanco);
            border-right: 1px solid var(--gris-bordes);
            overflow-y: auto;
            padding: 20px;
            transition: all 0.5s ease-in-out; 
        }

        .columna-derecha {
            width: 70%;
            padding: 40px;
            background-color: var(--blanco);
            transition: all 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center; 
            overflow-y: auto;
        }

        /* ESTADO "ZOOM ACTIVO" */
        body.modo-zoom .columna-izquierda {
            width: 0;
            padding: 0;
            opacity: 0;
            border: none;
        }

        body.modo-zoom .columna-derecha {
            width: 100%;
            padding: 40px 10%; 
        }

        h1, h2 { color: var(--azul-oscuro); font-weight: 700; }

        .caja-hospital {
            background-color: var(--blanco);
            border: 2px solid var(--gris-bordes);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            color: var(--azul-oscuro);
            transition: all 0.3s ease;
        }

        .caja-hospital:hover {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            border-color: var(--amarillo);
            transform: translateX(5px);
        }

        .cabecera-hospital {
            text-align: center;
            width: 100%;
            margin-bottom: 40px;
            display: none; 
            animation: fadeInDown 0.6s ease forwards;
        }

        .cabecera-hospital h1 {
            font-size: 2.5em;
            font-weight: 800;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .btn-volver {
            background-color: var(--azul-oscuro);
            border: 2px solid var(--azul-oscuro);
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--blanco);
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-volver:hover {
            background-color: var(--celeste);
            border-color: var(--celeste);
            color: var(--azul-oscuro);
        }

        .contenedor-pedidos {
            display: none; 
            width: 100%;
            display: flex;
            flex-wrap: wrap; 
            gap: 25px;
            justify-content: center; 
            align-items: flex-start;
        }

        .cajon-pedido {
            background-color: var(--blanco);
            border-radius: 12px;
            padding: 25px;
            width: 420px; 
            box-shadow: 0 10px 30px rgba(21, 50, 68, 0.1); 
            border: 1px solid var(--gris-bordes);
            border-top: 6px solid var(--amarillo);
            text-align: left;
            opacity: 0;
            transform: scale(0.8);
            animation: zoomIn 0.5s ease forwards;
            transition: background-color 0.3s ease;
        }

        .cajon-despriorizado {
            background-color: var(--naranja-suave) !important;
            border-top: 6px solid #ff9900; 
        }

        .etiqueta {
            font-size: 11px;
            font-weight: 700;
            background-color: var(--celeste);
            color: var(--azul-oscuro);
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .valor {
            font-size: 16px;
            font-weight: 500;
            color: var(--azul-oscuro);
            margin: 0;
            line-height: 1.4;
        }

        .texto-desplegable {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: var(--celeste);
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
            transition: all 0.2s ease;
        }

        .texto-desplegable:hover {
            color: #000;
            background-color: var(--celeste);
        }

        .detalle-oculto {
            display: none; 
            margin-top: 10px;
            padding: 12px;
            background-color: var(--gris-claro);
            border-left: 4px solid var(--amarillo);
            font-size: 13px;
            border-radius: 0 4px 4px 0;
            animation: fadeInDown 0.3s ease forwards;
        }
        .detalle-oculto.abierto { display: block; }

        .contenedor-tooltip { position: relative; display: block; width: fit-content; cursor: help; }
        .valor-tooltip { border-bottom: 1px dashed var(--azul-oscuro); }
        .tooltip-texto {
            visibility: hidden; width: max-content; background-color: var(--azul-oscuro);
            color: var(--blanco); text-align: center; border-radius: 6px; padding: 6px 12px;
            font-size: 12px; font-weight: 600; position: absolute; z-index: 1;
            bottom: 130%; left: 50%; transform: translateX(-50%); opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
        }
        .tooltip-texto::after {
            content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px;
            border-width: 5px; border-style: solid; border-color: var(--azul-oscuro) transparent transparent transparent;
        }
        .contenedor-tooltip:hover .tooltip-texto { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(-3px); }

        .btn-desplegar-cargos {
            width: 100%;
            background-color: var(--gris-claro);
            border: 1px solid var(--gris-bordes);
            padding: 12px;
            margin-top: 20px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--azul-oscuro);
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-desplegar-cargos:hover { background-color: var(--celeste); }

        .seccion-cargos {
            display: none; 
            margin-top: 15px;
            border-top: 2px dashed var(--gris-bordes);
            padding-top: 15px;
            animation: fadeInDown 0.3s ease forwards;
        }
        .seccion-cargos.abierto { display: block; }

        .cargo-item {
            background-color: var(--blanco);
            border: 1px solid var(--gris-bordes);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        .cargo-titulo { font-weight: 700; color: var(--azul-oscuro); margin-bottom: 5px; }
        .cargo-escalafon { font-size: 11px; color: #666; margin-bottom: 10px; text-transform: uppercase; }

        .grid-edicion { display: flex; gap: 10px; align-items: center; }
        .col-edicion { display: flex; flex-direction: column; align-items: center; }
        .col-edicion label { font-size: 10px; font-weight: 700; color: #888; margin-bottom: 4px; }
        
        .input-num {
            width: 45px;
            padding: 6px;
            border: 1px solid var(--azul-oscuro);
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-align: center;
            color: var(--azul-oscuro);
            transition: color 0.2s ease;
        }
        .input-num:focus { outline: 2px solid var(--celeste); }

        .input-prematuro { color: var(--gris-texto); }

        .contenedor-botones-copiar { display: flex; gap: 10px; margin-top: 15px; }
        .btn-copiar {
            flex: 1; background-color: var(--blanco); border: 2px solid var(--amarillo);
            color: var(--azul-oscuro); padding: 8px; border-radius: 6px; font-size: 11px;
            font-weight: 700; cursor: pointer; font-family: 'Montserrat', sans-serif;
            transition: all 0.2s;
        }
        .btn-copiar:hover { background-color: var(--amarillo); }
        .btn-copiar:active { transform: scale(0.95); }

        @keyframes zoomIn { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- ENCABEZADO FIJO CON EL LOGO -->
    <header class="encabezado-superior">
        <img src="https://res.cloudinary.com/olddxilu/image/upload/v1786640493/SEGUIMIENTO_OBRAS.png" alt="Seguimiento de Obras" class="logo-plataforma" id="imagen-logo">
    </header>

    <!-- CONTENEDOR PRINCIPAL QUE ABARCA LAS DOS COLUMNAS -->
    <div class="contenedor-principal">
        
        <div class="columna-izquierda">
            <h2>Hospitales</h2>
            <div class="caja-hospital" onclick="entrarHospital('Ramos Mejía')">Ramos Mejía</div>
            <div class="caja-hospital" onclick="entrarHospital('Santojanni')">Santojanni</div>
        </div>

        <div class="columna-derecha">
            <h2 id="mensaje-inicial" style="margin-top: 50px; color: #888; font-weight: 400;">Seleccioná un hospital para visualizar sus pedidos</h2>
            
            <div class="cabecera-hospital" id="cabecera">
                <button class="btn-volver" onclick="salirHospital()">← Volver a la lista</button>
                <h1 id="titulo-hospital">Nombre Hospital</h1>
            </div>

            <div class="contenedor-pedidos" id="grilla-pedidos" style="display: none;"></div>
        </div>

    </div>

    <script>
        const datosSheets = {
            "Ramos Mejía": [
                { 
                    tipo: "Obra", detalle: "5 NUEVAS CAMAS UTI", infoExtra: "En espera de licitación.", fecha: "26/06/26", prioridad: "DESPRIORIZADO", fechaPriorizacion: "09/01/2026",
                    cargos: [
                        { escalafon: "CPH MEDICO GUARDIA", puesto: "TERAPIA INTENSIVA", qPlan: 7, qPedido: 7, qAprobado: 0 },
                        { escalafon: "ENFERMERIA", puesto: "ENFERMERIA ATP", qPlan: 8, qPedido: 8, qAprobado: 0 }
                    ]
                },
                { 
                    tipo: "Obra", detalle: "10 camas nuevas de salud mental", infoExtra: "Se requieren modificaciones en el ala oeste.", fecha: "28/11/26", prioridad: "SI", fechaPriorizacion: "16/10/2025",
                    cargos: [
                        { escalafon: "ENFERMERIA", puesto: "ENFERMERIA", qPlan: 12, qPedido: 12, qAprobado: 0 },
                        { escalafon: "JEFE DE SECCION", puesto: "Salud Mental", qPlan: 1, qPedido: 1, qAprobado: 1 }
                    ]
                }
            ],
            "Santojanni": [
                { 
                    tipo: "Obra", detalle: "AMPLIACION UTI - UCO", infoExtra: "Aprobado en última asamblea.", fecha: "15/10/25", prioridad: "SI", fechaPriorizacion: "16/10/2025",
                    cargos: [
                        { escalafon: "ENFERMERIA", puesto: "ENFERMERIA", qPlan: 6, qPedido: 6, qAprobado: 6 }
                    ]
                }
            ]
        };

        let hospitalActual = ""; 

        function entrarHospital(nombreHospital) {
            hospitalActual = nombreHospital;
            document.body.classList.add('modo-zoom');
            document.getElementById('mensaje-inicial').style.display = 'none';
            document.getElementById('cabecera').style.display = 'block';
            document.getElementById('grilla-pedidos').style.display = 'flex';
            document.getElementById('titulo-hospital').innerText = nombreHospital;

            const grilla = document.getElementById('grilla-pedidos');
            grilla.innerHTML = '';

            const pedidos = datosSheets[nombreHospital];
            
            pedidos.forEach((pedido, indexObra) => {
                const claseFondo = (pedido.prioridad === "DESPRIORIZADO") ? "cajon-despriorizado" : "";
                const idDesplegable = `detalle-${indexObra}`;
                const idCargos = `cargos-${indexObra}`;

                let htmlPrioridad = `<p class="valor">${pedido.prioridad}</p>`;
                if (pedido.prioridad === "SI" || pedido.prioridad === "DESPRIORIZADO") {
                    htmlPrioridad = `
                        <div class="contenedor-tooltip">
                            <p class="valor valor-tooltip">${pedido.prioridad}</p>
                            <span class="tooltip-texto">Fecha: ${pedido.fechaPriorizacion}</span>
                        </div>
                    `;
                }

                let htmlListaCargos = "";
                pedido.cargos.forEach((cargo, indexCargo) => {
                    
                    let valorAprobadoVisual = cargo.qAprobado === 0 ? cargo.qPedido : cargo.qAprobado;
                    let claseAprobado = cargo.qAprobado === 0 ? "input-prematuro" : "";

                    htmlListaCargos += `
                        <div class="cargo-item">
                            <div class="cargo-titulo">${cargo.puesto}</div>
                            <div class="cargo-escalafon">Escalafón: ${cargo.escalafon}</div>
                            
                            <div class="grid-edicion">
                                <div class="col-edicion">
                                    <label>Q PLAN</label>
                                    <div style="font-weight:bold; padding: 6px;">${cargo.qPlan}</div>
                                </div>
                                <div class="col-edicion">
                                    <label>Q PEDIDO</label>
                                    <input type="number" id="input-pedido-${indexObra}-${indexCargo}" class="input-num" value="${cargo.qPedido}">
                                </div>
                                <div class="col-edicion">
                                    <label>Q APROB. HAC.</label>
                                    <input type="number" 
                                           id="input-aprobado-${indexObra}-${indexCargo}" 
                                           class="input-num ${claseAprobado}" 
                                           value="${valorAprobadoVisual}"
                                           oninput="this.classList.remove('input-prematuro')">
                                </div>
                            </div>
                        </div>
                    `;
                });

                const tarjetaHTML = `
                    <div class="cajon-pedido ${claseFondo}">
                        <div class="etiqueta">Tipo de Pedido</div>
                        <p class="valor">${pedido.tipo}</p>

                        <div class="etiqueta">Denominación / Detalle</div>
                        <p class="valor texto-desplegable" onclick="alternarDetalle('${idDesplegable}')">
                            ${pedido.detalle} ▾
                        </p>
                        <div class="detalle-oculto" id="${idDesplegable}">
                            ${pedido.infoExtra}
                        </div>

                        <div class="etiqueta">Fecha de Fin</div>
                        <p class="valor">${pedido.fecha}</p>

                        <div class="etiqueta">Priorización</div>
                        ${htmlPrioridad}

                        <button class="btn-desplegar-cargos" onclick="alternarDetalle('${idCargos}')">
                            Gestionar RRHH (${pedido.cargos.length}) ▾
                        </button>

                        <div class="seccion-cargos" id="${idCargos}">
                            ${htmlListaCargos}
                            
                            <div class="contenedor-botones-copiar">
                                <button class="btn-copiar" onclick="copiarInfo(${indexObra}, 'pedido', this)">
                                    📋 Copiar Q PEDIDO
                                </button>
                                <button class="btn-copiar" onclick="copiarInfo(${indexObra}, 'aprobado', this)">
                                    📋 Copiar Q APROBADO
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grilla.innerHTML += tarjetaHTML;
            });
        }

        function salirHospital() {
            document.body.classList.remove('modo-zoom');
            document.getElementById('cabecera').style.display = 'none';
            document.getElementById('grilla-pedidos').style.display = 'none';
            setTimeout(() => { document.getElementById('mensaje-inicial').style.display = 'block'; }, 300);
        }

        function alternarDetalle(id) {
            document.getElementById(id).classList.toggle('abierto');
        }

        function copiarInfo(indexObra, tipoCopia, boton) {
            const pedido = datosSheets[hospitalActual][indexObra];
            
            let textoPortapapeles = `🏥 *Hospital:* ${hospitalActual}\n`;
            textoPortapapeles += `🏗️ *Obra:* ${pedido.detalle}\n`;
            
            if (tipoCopia === 'pedido') {
                textoPortapapeles += `📋 *ESTADO: Q PEDIDO*\n\n`;
            } else {
                textoPortapapeles += `✅ *ESTADO: Q APROBADO HACIENDA*\n\n`;
            }

            pedido.cargos.forEach((cargo, indexCargo) => {
                if (tipoCopia === 'pedido') {
                    let valorActual = document.getElementById(`input-pedido-${indexObra}-${indexCargo}`).value;
                    textoPortapapeles += `- [${cargo.escalafon}] ${cargo.puesto}: *${valorActual}*\n`;
                } else {
                    let valorActual = document.getElementById(`input-aprobado-${indexObra}-${indexCargo}`).value;
                    textoPortapapeles += `- [${cargo.escalafon}] ${cargo.puesto}: *${valorActual}*\n`;
                }
            });

            navigator.clipboard.writeText(textoPortapapeles).then(() => {
                const textoOriginal = boton.innerText;
                boton.innerText = "¡Copiado!";
                boton.style.backgroundColor = "var(--celeste)";
                
                setTimeout(() => {
                    boton.innerText = textoOriginal;
                    boton.style.backgroundColor = "var(--blanco)";
                }, 2000); 
            });
        }
    </script>
</body>
</html>
