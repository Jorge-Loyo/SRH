<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Salud • Acceso</title>
  <link rel="icon" type="image/svg+xml" href="/admin-static/favicon.svg" />
  <link rel="stylesheet" href="/admin-static/admin-login.css" />
  <meta name="color-scheme" content="light" />
</head>
<body>
  <main class="login">
    <section class="card" role="dialog" aria-labelledby="login-title">
      <header class="brand">
  <img src="/admin-static/logo1.png" alt="Sistema de Salud" class="logo" />
        <h1 id="login-title">Acceso</h1>
        <p class="subtitle">Panel interno del Sistema de Salud</p>
      </header>
      <form class="form" method="POST" action="/admin/login" autocomplete="on">
        <div class="field">
          <label for="email">Usuario</label>
          <input id="email" name="email" type="text" inputmode="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
  <button class="btn" type="submit">Ingresar</button>
  <p id="error" class="error" hidden>Credenciales inválidas. Intenta nuevamente.</p>
  <p id="attempts" class="error" hidden></p>
      </form>
      <footer class="meta">
        <small>© <span id="year"></span> Sistema de Salud</small>
      </footer>
    </section>
  </main>
  <script>




    // Muestra un mensaje simple cuando hay error en querystring, sin depender de flash interno
    (function(){
      const params = new URLSearchParams(location.search);
      if (params.has('error') || params.get('notice') === 'loginFailed') {
        document.getElementById('error').hidden = false;
        // Mostrar intentos restantes si está en la query
        const left = params.get('left');
        if (left !== null) {
          const attempts = document.getElementById('attempts');
          attempts.textContent = `Intentos restantes: ${left}`;
          attempts.hidden = false;
        }
      }
      // Mensaje de logout removido
      document.getElementById('year').textContent = new Date().getFullYear();
      // Enfocar email para accesibilidad
      const email = document.getElementById('email');
      if (email) email.focus();
    })();
  </script>
</body>
</html>
